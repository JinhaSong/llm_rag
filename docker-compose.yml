name: gloss-recommender

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    ports:
      - "11435:11434"
    environment:
      OLLAMA_ORIGINS: "*"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      ollama pull qwen3:14b
      ollama pull bge-m3
    restart: "no"

  api-1107:
    build:
      context: .
      dockerfile: gloss-recommender/Dockerfile.api
    environment:
      PORT: "3100"
      GLOSS_SET: "1107"
      GLOSS_SET_LABEL: "ETRIKSL 1107 (수포합 제외, 0–10 유지)"
      OLLAMA_URL: http://ollama:11434
      OMNISERVE_URL: http://host.docker.internal:8000/a/v1
      OPENAI_COMPATIBLE_URL: http://host.docker.internal:8000/v1
      QUESTION_ANSWER_POOL: /data/llm_pipeline/question_answer_pool.json
      LLM_GLOSS_VECTOR_DB: /data/llm_pipeline/variants/1107/gloss_vector_db.json
      QUESTION_RETRIEVAL_INDEX: /data/llm_pipeline/question_retrieval_index.json
      KEYWORD_GLOSS_MAP: /data/llm_pipeline/variants/1107/keyword_gloss_map.json
      INTENT_GLOSS_SETS: /data/llm_pipeline/variants/1107/intent_gloss_sets.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api-keywords:
    build:
      context: .
      dockerfile: gloss-recommender/Dockerfile.api
    environment:
      PORT: "3100"
      GLOSS_SET: "keywords"
      GLOSS_SET_LABEL: "답변 핵심표제어 only (수포합 제외, 0–10 보충)"
      OLLAMA_URL: http://ollama:11434
      OMNISERVE_URL: http://host.docker.internal:8000/a/v1
      OPENAI_COMPATIBLE_URL: http://host.docker.internal:8000/v1
      QUESTION_ANSWER_POOL: /data/llm_pipeline/question_answer_pool.json
      LLM_GLOSS_VECTOR_DB: /data/llm_pipeline/variants/keywords/gloss_vector_db.json
      QUESTION_RETRIEVAL_INDEX: /data/llm_pipeline/question_retrieval_index.json
      KEYWORD_GLOSS_MAP: /data/llm_pipeline/variants/keywords/keyword_gloss_map.json
      INTENT_GLOSS_SETS: /data/llm_pipeline/variants/keywords/intent_gloss_sets.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web-1107:
    build:
      context: .
      dockerfile: gloss-recommender/Dockerfile
    environment:
      API_HOST: api-1107
      NGINX_ENVSUBST_FILTER: API_HOST
    ports:
      - "8777:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api-1107
    restart: unless-stopped

  web-keywords:
    build:
      context: .
      dockerfile: gloss-recommender/Dockerfile
    environment:
      API_HOST: api-keywords
      NGINX_ENVSUBST_FILTER: API_HOST
    ports:
      - "8779:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api-keywords
    restart: unless-stopped
